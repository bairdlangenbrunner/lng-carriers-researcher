[project]
name = "lng-carrier-tracker"
version = "0.1.0"
description = "Research scaffolding for the LNG Carrier Tracker — SOPs, tooling, and per-batch outputs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LNG Carrier Tracker maintainers" },
]
# NOTE: all network fetching shells out to the system `curl` binary (see
# scripts/fetch.py), which pip cannot declare — install curl separately.
dependencies = [
    "openpyxl>=3.1.2",      # build_workbook.py, recalc.py
    "curl_cffi>=0.10",      # fetch.py: Chrome TLS fingerprint for Cloudflare firewall pages
    "websocket-client>=1.6",  # cf_clearance.py: drives Google Chrome over DevTools
    "websockets>=12",       # ais_static.py: aisstream.io feed (same pin as ../lng-carriers-map)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length — covered by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
